---
# Workflow Engine - DAG execution & orchestration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-engine
  namespace: cloudlabos
  labels:
    app: workflow-engine
    app.kubernetes.io/name: workflow-engine
    app.kubernetes.io/part-of: cloudlabos
    app.kubernetes.io/component: engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: workflow-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cloudlabos
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: workflow-engine
          image: cloudlabos/workflow-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudlabos-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cloudlabos-secrets
                  key: redis-url
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudlabos-secrets
                  key: openrouter-api-key
            - name: AGENT_SERVICE_URL
              value: "http://agent-service:8001"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-engine
  namespace: cloudlabos
  labels:
    app: workflow-engine
spec:
  type: ClusterIP
  selector:
    app: workflow-engine
  ports:
    - port: 8002
      targetPort: 8002
      name: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workflow-engine
  namespace: cloudlabos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow-engine
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
