---
# CloudLabOS - Secrets (populated by Terraform or manually)
apiVersion: v1
kind: Secret
metadata:
  name: cloudlabos-secrets
  namespace: cloudlabos
  labels:
    app.kubernetes.io/part-of: cloudlabos
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # echo -n 'value' | base64
  database-url:       postgresql://cloudlabos:CHANGE_ME@postgres:5432/cloudlabos
  redis-url:          redis://:CHANGE_ME@redis:6379
  qdrant-url:         http://qdrant-service:6333
  jwt-secret:         CHANGE_ME
  encryption-key:     CHANGE_ME
  openrouter-api-key: CHANGE_ME
