version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [cloudlabos]

  # Frontend
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:8000
      NEXT_PUBLIC_WS_URL: ws://api-gateway:8000
      NEXT_PUBLIC_DEMO_MODE: "false"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on: [api-gateway]
    networks: [cloudlabos]

  # API Gateway
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cloudlabos:${POSTGRES_PASSWORD}@postgres:5432/cloudlabos
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AGENT_SERVICE_URL: http://agent-service:8001
      WORKFLOW_ENGINE_URL: http://workflow-engine:8002
      MEMORY_SERVICE_URL: http://memory-service:8003
      BROWSER_SERVICE_URL: http://browser-service:8004
      RESEARCH_SERVICE_URL: http://research-service:8005
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local}
      ARTIFACT_STORAGE_PATH: ${ARTIFACT_STORAGE_PATH:-/data/artifacts}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - artifact_data:/data/artifacts
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    depends_on: [postgres, redis]
    networks: [cloudlabos]

  # Agent Service
  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://cloudlabos:${POSTGRES_PASSWORD}@postgres:5432/cloudlabos
      QDRANT_URL: http://qdrant:6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MEMORY_SERVICE_URL: http://memory-service:8003
      BROWSER_SERVICE_URL: http://browser-service:8004
      RESEARCH_SERVICE_URL: http://research-service:8005
    depends_on: [redis, postgres, qdrant]
    deploy:
      replicas: 1
    networks: [cloudlabos]

  # Workflow Engine
  workflow-engine:
    build:
      context: ./apps/workflow-engine
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://cloudlabos:${POSTGRES_PASSWORD}@postgres:5432/cloudlabos
    depends_on: [redis, postgres]
    networks: [cloudlabos]

  # Memory Service
  memory-service:
    build:
      context: ./apps/memory-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://cloudlabos:${POSTGRES_PASSWORD}@postgres:5432/cloudlabos
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on: [qdrant, redis, postgres]
    networks: [cloudlabos]

  # Browser Service
  browser-service:
    build:
      context: ./apps/browser-service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    shm_size: 2gb
    cap_add: [SYS_ADMIN]
    networks: [cloudlabos]

  # Research Service
  research-service:
    build:
      context: ./apps/research-service
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks: [cloudlabos]

  # Infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudlabos
      POSTGRES_USER: cloudlabos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks: [cloudlabos]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [cloudlabos]

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks: [cloudlabos]

  # Monitoring
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [cloudlabos]

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [cloudlabos]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [cloudlabos]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  artifact_data:

networks:
  cloudlabos:
    driver: bridge
